# Serving stack for benchmarking. Every service that loads the model needs a GPU;
# bring up one backend at a time unless the host has enough VRAM for several
# 7B engines at once (each reserves ~90% of a device by default).
#
#   docker compose --profile vllm up          # vLLM behind the llm_serve API
#   docker compose --profile triton up        # Triton Python backend
#   docker compose --profile ray up           # Ray Serve
#   docker compose --profile monitoring up -d # Prometheus + Grafana

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  api:
    profiles: ["vllm"]
    <<: *gpu
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ray   # ships vLLM + the serving package
    command: >
      python -m llm_serve.server
      --config configs/serving.yaml
      --backend vllm
      --host 0.0.0.0 --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      LLM_SERVE_MODEL__LORA_ADAPTER: ${LORA_ADAPTER:-}
    volumes:
      - hf-cache:/home/ray/models/hf
      - ../artifacts:/home/ray/app/artifacts
    ports:
      - "8000:8000"
    shm_size: "8gb"

  triton:
    profiles: ["triton"]
    <<: *gpu
    build:
      context: ..
      dockerfile: deploy/Dockerfile.triton
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      LLM_SERVE_LORA_ADAPTER: ${LORA_ADAPTER:-}
    volumes:
      - hf-cache:/models/hf
    ports:
      - "8100:8000"   # HTTP
      - "8101:8001"   # gRPC — the streaming client connects here
      - "8102:8002"   # Prometheus metrics
    shm_size: "8gb"

  ray:
    profiles: ["ray"]
    <<: *gpu
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ray
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      LLM_SERVE_LORA_ADAPTER: ${LORA_ADAPTER:-}
      LLM_SERVE_MAX_REPLICAS: ${RAY_MAX_REPLICAS:-1}
    volumes:
      - hf-cache:/home/ray/models/hf
    ports:
      - "8200:8000"   # Serve HTTP
      - "8265:8265"   # Ray dashboard
    shm_size: "8gb"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  hf-cache:
