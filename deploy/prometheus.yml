# Scrape config for the serving stack.
#   docker compose --profile monitoring up -d
# then open http://localhost:9090 (Prometheus) or http://localhost:3000 (Grafana).

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    stack: llm_serve

scrape_configs:
  # llm_serve API (vLLM / TensorRT-LLM in-process, or fronting Triton / Ray).
  - job_name: llm_serve_api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          backend: vllm

  # Triton exports its own metrics on :8002 (queue time, compute time, GPU util).
  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]
        labels:
          backend: triton

  # Ray Serve exposes deployment and replica metrics through the Ray metrics agent.
  - job_name: ray_serve
    metrics_path: /metrics
    static_configs:
      - targets: ["ray:8080"]
        labels:
          backend: ray

rule_files:
  - /etc/prometheus/alerts.yml
