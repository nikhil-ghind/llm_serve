<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Animation of continuous batching: requests joining and leaving the running batch on every engine step">
  <title>Continuous batching: the batch is rebuilt on every scheduler step</title>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8b949e">Continuous batching &#8212; Scheduler.step() rebuilds the batch every iteration</text>
  <text x="20" y="48" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Each column is one engine step. A request joins the moment there is token budget, and leaves the moment it finishes.</text>
